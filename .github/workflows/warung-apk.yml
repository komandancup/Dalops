name: Build APK Warung

# Manual only: Actions tab → "Build APK Warung" → Run workflow.
# Set the repository variable WARUNG_URL (Settings → Secrets and variables → Actions → Variables) first.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warung
    steps:
      - name: Check WARUNG_URL
        working-directory: .
        env:
          WARUNG_URL: ${{ vars.WARUNG_URL }}
        run: |
          if [ -z "$WARUNG_URL" ]; then
            echo "::error::Repository variable WARUNG_URL is not set (e.g. https://nama-warung.vercel.app)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: warung/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build

      - run: npx cap sync android
        env:
          WARUNG_URL: ${{ vars.WARUNG_URL }}

      - run: ./gradlew assembleDebug
        working-directory: warung/android

      - uses: actions/upload-artifact@v4
        with:
          name: warung-apk
          path: warung/android/app/build/outputs/apk/debug/*.apk
